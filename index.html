<meta charset="utf-8">

<style>
    :root {
        --bg: #f3f6f4;
        --card: #ffffff;
        --ink: #14231c;
        --muted: #5d6f66;
        --accent: #0f7a5a;
        --accent-ink: #ffffff;
        --line: #d9e2dd;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f1a15;
            --card: #17251e;
            --ink: #e8f1ec;
            --muted: #94a89d;
            --accent: #3ecf9b;
            --accent-ink: #06231a;
            --line: #26382f;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 28px; }
    .balance {
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
    }
    .balance small { opacity: .8; }
    .balance strong { display: block; font-size: 38px; margin-top: 4px; }
    section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
    }
    h2 { font-size: 18px; margin: 0 0 12px; }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
    input {
        width: 100%;
        margin-top: 4px;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
    }
    button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 11px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
    }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .status { margin-top: 12px; font-size: 14px; min-height: 20px; color: var(--accent); }
</style>
</head>
<body>
<main>
    <h1>Кошелёк</h1>
    <p class="lead">Тестовая веб-версия приложения для учебного проекта. Деньги здесь не списываются.</p>

    <div class="balance">
        <small>Баланс</small>
        <strong id="balance">10 000 ₽</strong>
    </div>

    <section>
        <h2>Регистрация</h2>
        <label>Телефон
            <input type="tel" placeholder="+7 900 000-00-00">
        </label>
        <button id="register-btn" type="button">Зарегистрироваться</button>
        <div class="status" id="register-status"></div>
    </section>

    <section>
        <h2>Перевод другу</h2>
        <label>Сумма, ₽
            <input id="transfer-amount" type="number" min="1" value="500">
        </label>
        <button id="transfer-btn" type="button">Перевести</button>
        <div class="status" id="transfer-status"></div>
    </section>

    <section>
        <h2>Оплата услуг</h2>
        <label>Сумма, ₽
            <input id="payment-amount" type="number" min="1" value="300">
        </label>
        <button id="payment-btn" type="button">Оплатить</button>
        <div class="status" id="payment-status"></div>
    </section>
</main>

<script>
    // ШАГ 2. 
    var COUNTER_ID =113665088;

    var balance = 10000;

    function fmt(n) { return n.toLocaleString("ru-RU") + " ₽"; }
    function goal(name, params) {
        // Отправка цели в Метрику; не ломается, если счётчик ещё не вставлен
        try { ym(COUNTER_ID, "reachGoal", name, params); } catch (e) { console.log("Метрика не подключена:", name); }
    }
    function pay(inputId, statusId, goalName, okText) {
        var amount = Number(document.getElementById(inputId).value);
        var status = document.getElementById(statusId);
        if (!amount || amount <= 0) { status.textContent = "Введите сумму больше нуля."; return; }
        if (amount > balance) { status.textContent = "Недостаточно средств."; return; }
        balance -= amount;
        document.getElementById("balance").textContent = fmt(balance);
        status.textContent = okText + " " + fmt(amount) + ".";
        goal(goalName, { amount: amount });
    }

    document.getElementById("register-btn").addEventListener("click", function () {
        document.getElementById("register-status").textContent = "Готово, вы зарегистрированы.";
        goal("register_click");
    });
    document.getElementById("transfer-btn").addEventListener("click", function () {
        pay("transfer-amount", "transfer-status", "transfer_click", "Переведено");
    });
    document.getElementById("payment-btn").addEventListener("click", function () {
        pay("payment-amount", "payment-status", "payment_click", "Оплачено");
    });
</script>
</body>
</html>
